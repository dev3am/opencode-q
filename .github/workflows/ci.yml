name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch history so we can check base ref version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install web dependencies
        run: cd web && bun install --frozen-lockfile

      - name: Check if version is bumped (PR only)
        if: github.event_name == 'pull_request'
        run: |
          # Fetch the target branch of the PR to compare
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }}
          
          # Extract versions
          VERSION_BASE=$(git show ${{ github.base_ref }}:package.json | node -e "console.log(JSON.parse(require('fs').readFileSync(0, 'utf-8')).version)")
          VERSION_CURRENT=$(node -e "console.log(require('./package.json').version)")
          
          echo "Base branch (${{ github.base_ref }}) version: $VERSION_BASE"
          echo "Current PR branch version: $VERSION_CURRENT"
          
          if [ "$VERSION_BASE" = "$VERSION_CURRENT" ]; then
            echo "❌ Error: package.json version has not been bumped compared to ${{ github.base_ref }} ($VERSION_BASE)."
            echo "👉 Please bump the version (major/minor/patch) in package.json before merging."
            exit 1
          fi
          echo "✅ Version bump verified successfully ($VERSION_BASE -> $VERSION_CURRENT)."

      - name: Lint check (Biome)
        run: bun run lint

      - name: Type check (TypeScript)
        run: bunx tsc --noEmit

      - name: Run tests
        run: bun test

      - name: Build project
        run: bun run build
