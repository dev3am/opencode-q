name: CD

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (for NPM registry auth)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install web dependencies
        run: cd web && bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      - name: Check NPM version conflict
        id: check-npm
        run: |
          PACKAGE_NAME=$(node -e "console.log(require('./package.json').name)")
          CURRENT_VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "Package: $PACKAGE_NAME, Current Version: $CURRENT_VERSION"
          
          # Check if the current version is already published on NPM
          if npm view "$PACKAGE_NAME@$CURRENT_VERSION" version > /dev/null 2>&1; then
            echo "⚠️ Version $CURRENT_VERSION is already published on NPM. Skipping deployment."
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "🚀 Version $CURRENT_VERSION is not published yet. Proceeding with deployment."
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish to NPM
        if: steps.check-npm.outputs.should_publish == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
